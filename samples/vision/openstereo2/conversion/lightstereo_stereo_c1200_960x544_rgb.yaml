# BSTNNX 8.3.1 image calibration example.
# Preprocessing adapted from legacy bst_robot_model_zoo/sftp_upload/models/OpenStereo-2/train/compiler/main_c1200.yaml.
# The ONNX is included under assets/. Supply representative calibration images and verify preprocessing.
model_path: ./assets/lightstereo/checkpoint_epoch_299.onnx
model_name: lightstereo
result_dir: ./output/lightstereo
device_engine: C1200
logging_level: INFO
Quant:
  inputs:
  - name: left_img
    data_reader_method: image_folder_data_reader
    input_data_set_path: ./calibration_images/lightstereo/left
    image_process_config:
      mean:
      - 123.675
      - 116.28
      - 103.53
      scale:
      - 0.01708984375
      - 0.017578125
      - 0.017333984375
      source_image_format: RGB
      target_image_format: RGB
  - name: right_img
    data_reader_method: image_folder_data_reader
    input_data_set_path: ./calibration_images/lightstereo/right
    image_process_config:
      mean:
      - 123.675
      - 116.28
      - 103.53
      scale:
      - 0.01708984375
      - 0.017578125
      - 0.017333984375
      source_image_format: RGB
      target_image_format: RGB
  size_limit: 50
  accuracy_level: 1
Backend:
  net_batch_size: 1
  partition:
    partition_method: partition_greedy
  emulation:
    profiling_mode: 2
