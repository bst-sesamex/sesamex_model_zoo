# BSTNNX 8.3.1 image calibration example.
# Preprocessing adapted from legacy bst_robot_model_zoo/sftp_upload/models/reid/train/bst_deploy/compiler/main.yaml.
# ONNX is included in assets/; supply representative calibration images.
# The archived YAML is shared across this model family; verify preprocessing for this variant before accuracy claims.
model_path: ./assets/mobilenetv2/mobilenetv2_x1_0_1dot0_market.pth.onnx
model_name: reid
result_dir: ./output/mobilenetv2
device_engine: C1200
logging_level: INFO
Quant:
  inputs:
  - name: images
    data_reader_method: image_folder_data_reader
    input_data_set_path: ./calibration_images/mobilenetv2
    image_process_config:
      source_image_format: BGR
      target_image_format: RGB
      mean:
      - 123.675
      - 116.28
      - 103.53
      scale:
      - 0.01708984375
      - 0.017578125
      - 0.017333984375
  size_limit: 50
  accuracy_level: 1
Backend:
  net_batch_size: 1
  partition:
    partition_method: partition_greedy
  emulation:
    profiling_mode: 2
