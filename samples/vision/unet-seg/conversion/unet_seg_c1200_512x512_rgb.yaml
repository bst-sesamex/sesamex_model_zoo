# BSTNNX 8.3.1 image calibration example.
# Preprocessing parameters: mean, scale and color conversion below are the calibration-time settings.yaml.
# The ONNX is included under assets/. Supply representative calibration images and verify preprocessing.
# Segmentation preprocessing parameters below: verify model_name matches the selected ONNX before compiling.
model_path: ./assets/unet_512x512/unet_cityscapes_512x512.onnx
model_name: unet_512x512
result_dir: ./output/unet_512x512
device_engine: C1200
logging_level: INFO
Quant:
  inputs:
  - name: input
    data_reader_method: image_folder_data_reader
    input_data_set_path: ./calibration_images/unet_512x512
    image_process_config:
      source_image_format: BGR
      target_image_format: RGB
      mean:
      - 72.3924
      - 82.90902
      - 73.158325
      scale:
      - 1.0
      - 1.0
      - 1.0
  size_limit: 50
  accuracy_level: 1
Backend:
  net_batch_size: 1
  partition:
    partition_method: partition_greedy
  emulation:
    profiling_mode: 2
