# BSTNNX 8.3.1 image calibration example.
# Preprocessing adapted from legacy bst_robot_model_zoo/sftp_upload/models/condlanenet/train/compiler/condlanenet_c1200.yaml.
# The ONNX is included under assets/. Supply representative calibration images and verify preprocessing.
model_path: ./assets/condlanenet/condlanenet.onnx
model_name: condlanenet
result_dir: ./output/condlanenet
device_engine: C1200
logging_level: INFO
Quant:
  inputs:
  - name: input.1
    data_reader_method: image_folder_data_reader
    input_data_set_path: ./calibration_images/condlanenet
    image_process_config:
      source_image_format: BGR
      target_image_format: BGR
      mean:
      - 75.3
      - 76.6
      - 77.6
      scale:
      - 0.019775390625
      - 0.0185546875
      - 0.018310546875
  size_limit: 50
  accuracy_level: 1
Backend:
  net_batch_size: 1
  partition:
    partition_method: partition_greedy
  emulation:
    profiling_mode: 2
