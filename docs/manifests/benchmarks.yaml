schema_version: 1
release:
  platform: aura-kalos
  version: "1.0.0"
# Aura C1200 C++ model measurements; three warmup-once rounds, median latency.
# Timing method: utils/tools/BUILD_AND_BENCHMARK.md; raw device logs are kept outside this repository.
benchmarks:
  - id: yolov8n-det-cpp-aura
    sample_id: yolov8
    variant_id: yolov8n-det
    asset_filename: yolov8n-det.Enrsd.bin
    input: { shape: [3, 640, 640], format: RGB888P }
    environment: { hardware: Aura_C1200, runtime: libbsnnrt 0.13.0, timing: board-side monotonic clock }
    performance:
      - { metric: throughput, value: 392.46, unit: fps, qualifier: exact, scope: "1000 / median latency of 3 rounds" }
      - { metric: latency, value: 2.548, unit: ms, qualifier: exact, scope: "median of 3 warmup-once C++ run+wait measurements" }
    source: { path: samples/vision/yolov8/evaluator/README.md, section: "Performance Benchmark", provenance: C1200-sample-benchmark }
